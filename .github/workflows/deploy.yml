name: Deploy to GitHub Pages

# ---------------------------------------------------------------------------
# Third-party actions are pinned to commit SHAs, not tags.
#
# Why: a major-version tag like `@v4` floats — the action's owner (or an
# attacker with write access, cf. the tj-actions/changed-files incident in
# March 2025) can retarget `v4` to a malicious commit and it silently flows
# into every workflow that uses the tag. SHAs are immutable, so pinning
# locks the exact code we audit and trust.
#
# The trailing `# vX.Y.Z` comment records which released version each SHA
# corresponds to — use it when bumping. To update safely:
#   1. Read the release notes for the new version.
#   2. Look up the commit SHA GitHub published for that tag (Releases page
#      or `gh api repos/<owner>/<action>/git/refs/tags/<tag>`).
#   3. Replace both SHA and version comment in the same commit.
# Dependabot (`version-updates` for `github-actions`) automates this if
# configured; pinning-by-SHA is still honoured.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The committed .npmrc pins `script-shell` to a Windows git-bash path for
    # local dev (see .npmrc header). Override it here so CI uses the Linux
    # shell — npm honours NPM_CONFIG_* env vars over .npmrc.
    env:
      NPM_CONFIG_SCRIPT_SHELL: /bin/bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d  # v4.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
