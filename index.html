<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tomás Correa | Technical Artist</title>

    <!--
      ── Content Security Policy ──────────────────────────────────────────
      Hardening notes (read before relaxing):

      script-src 'self' 'sha256-…' 'wasm-unsafe-eval'
        No 'unsafe-inline', no 'unsafe-eval', no CDN wildcards. The one hash
        covers the JSON-LD <script type="application/ld+json"> block below;
        any whitespace change inside that block will break the hash — regenerate
        with:  openssl dgst -sha256 -binary <script.txt> | openssl base64 -A
        'wasm-unsafe-eval' only allows compiling WebAssembly (Spark's splat
        sorter), not JS eval. This is the primary XSS defence and MUST NOT be
        loosened further.

      style-src 'self' 'unsafe-inline'
        Required because desktop.js / mobile.js set many dynamic style.*
        properties at runtime (animation delays, transform values for FLIP
        transitions, splat-viewer sizing). 'unsafe-inline' cannot execute
        JavaScript; the risk it enables is CSS-based data exfiltration IF an
        XSS is ever introduced elsewhere. Defence-in-depth only — not a
        direct hole today. To remove 'unsafe-inline' in the future, refactor
        every `el.style.X = Y` to CSS-variable-driven classes.

      default-src 'self', object-src 'none', base-uri 'self'
        Deny-by-default for any fetch not explicitly listed. object-src 'none'
        kills <embed>/<object>/<applet> injection vectors.

      font-src 'self' data:            — self-hosted fonts; `data:` allowed for
                                         any inlined <4KB font Vite emits.
      img-src  'self' data: blob:      — thumbnails + blob URLs for splat previews.
      connect-src 'self' blob: data:   — XHR/fetch only same-origin; blob: for
                                         splat streaming; data: because Spark
                                         fetches its inlined wasm from a data: URL.
      worker-src 'self' blob:          — 'self' for the particle sampling worker
                                         (same-origin file); blob: for Spark.

      frame-ancestors: not set, and there is NO clickjacking protection.
      Meta-tag CSP ignores frame-ancestors per spec, default-src does not
      cover it, and GitHub Pages can't send response headers. Acceptable:
      the site has no state-changing actions.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-pZggCbhNUH0foQju3+MCJ6mNljXDHBkiWHPgnNz6vQ8=' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="Portfolio of Tomás Correa, Technical Artist specializing in shaders, VFX, 3D art, and game development." />
    <meta name="author" content="Tomás Correa" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon (PNGs generated by scripts/make-icons.py) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tomás Correa | Technical Artist" />
    <meta property="og:description" content="Portfolio showcasing shaders, VFX, 3D art, and game development work." />
    <meta property="og:url" content="https://tomascorreag.github.io/" />
    <meta property="og:site_name" content="Tomás Correa" />
    <meta property="og:locale" content="en_US" />
    <!-- Generated by scripts/make-og-image.py. Crawlers need an absolute URL. -->
    <meta property="og:image" content="https://tomascorreag.github.io/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Green CRT terminal text reading Tomás Correa, Technical Artist, under a white pixel-art rabbit" />
    <link rel="canonical" href="https://tomascorreag.github.io/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tomás Correa | Technical Artist" />
    <meta name="twitter:description" content="Portfolio showcasing shaders, VFX, 3D art, and game development work." />
    <meta name="twitter:image" content="https://tomascorreag.github.io/og-image.png" />
    <meta name="twitter:image:alt" content="Green CRT terminal text reading Tomás Correa, Technical Artist, under a white pixel-art rabbit" />

    <!-- Structured data: CSP hash in script-src above must match this block byte-for-byte. -->
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"Tomás Correa","jobTitle":"Technical Artist","url":"https://tomascorreag.github.io/","sameAs":["https://www.linkedin.com/in/tomás-correa-551b0a243","https://github.com/tomascorreag"],"alumniOf":{"@type":"CollegeOrUniversity","name":"Universidad de los Andes"},"knowsAbout":["Technical art","Shaders","Visual effects","3D art","Game development","Procedural materials"]}</script>

    <!--
      Font preload: the first thing any visitor sees is terminal text typing
      in Martian Mono. Without this hint the font is discovered only after
      the CSS downloads and parses, so first visits watched the intro swap
      from fallback monospace mid-animation (font-display: swap). crossorigin
      is required even same-origin — font fetches use CORS mode, and a
      preload whose mode mismatches is silently discarded (double download).
      Vite rewrites the href to the hashed URL at build time.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/assets/fonts/MartianMono-latin.woff2" />

    <!--
      base.css is the ONLY render-blocking stylesheet: fonts, palette vars,
      reset/background, and the few components shared by both branches.
      The desktop scene CSS ships inside the desktop JS chunk (desktop.js
      imports style.css), mobile CSS inside the mobile chunk, deck CSS inside
      the deck chunk — no visitor downloads the other branch's styles.
    -->
    <link rel="stylesheet" href="/src/base.css" />
  </head>
  <body>
    <!-- CRT screen container - all CRT effects apply to content inside -->
    <div id="crt-screen">
      <!-- Terminal - full screen, JS populates -->
      <main id="terminal" class="terminal crt-effects"></main>
      <!-- Nav menu - absolutely positioned center, hidden until after intro -->
      <nav id="nav-menu" class="nav-menu crt-effects" hidden></nav>
      <!-- Rabbit spawns here via JS -->
    </div>

    <!-- Scanline overlay - sits above everything, doesn't block clicks -->
    <div class="crt-overlay"></div>

    <!-- Thumbnail mosaic grid - outside #crt-screen so it's above scanline overlay -->
    <div id="mosaic" class="mosaic-grid" hidden></div>

    <!--
      Plain-text fallback for visitors without JS and for link unfurlers /
      crawlers that don't run it. Keep in sync with GENERAL_CONTENT and the
      project titles in src/config/content.js. No email here on purpose
      (content.js splits it to dodge scrapers).
    -->

          <li>Stylised toon shader</li>
          <li>3D art: Ardo, Menpō, Ciudad Faro, Brain Farm, Ascension V</li>
        </ul>
        <p>This site is interactive and needs JavaScript.</p>
        <p><a href="https://github.com/tomascorreag" style="color: inherit">GitHub</a> · <a href="https://www.linkedin.com/in/tomás-correa-551b0a243" style="color: inherit">LinkedIn</a></p>
      </div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
